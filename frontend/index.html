<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon: uses the real rockspire-logo.png dropped into public/.
      If the PNG is not yet there, the browser falls back gracefully.
    -->
    <link rel="icon" type="image/png" href="/rockspire-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>ROCKSPIRE SOFY — Private Project Collaboration</title>
    <meta
      name="description"
      content="ROCKSPIRE SOFY is a space-themed, private project-collaboration platform. Every project is its own rocket. Claim your department and build something that matters."
    />
    <meta name="theme-color" content="#FDFBD4" />

    <!--
      Google Fonts — loaded here so they are available before any CSS renders.
      Four font families, each with only the weights we actually use.
      font-display=swap prevents invisible text during font load.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Aboreto&family=Alumni+Sans:wght@400;600;700&family=Advent+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
